name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass pocketagent -keypass pocketagent \
            -alias pocket -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Pocket Agent, O=AnishtayiN"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: pocketagent
          KEY_ALIAS: pocket
          KEY_PASSWORD: pocketagent
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "PocketAgent-${{ github.ref_name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-agent-apk
          path: "PocketAgent-*.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "PocketAgent-*.apk"
          body: |
            ## Pocket Agent — ایجنت جیبی

            An Android AI agent with a name, a long-term memory and real tools on your phone:
            live web search & page fetch, image generation, battery & device info, a private
            file workspace — and it remembers you between conversations.

            - Persian RTL chat UI; the agent's name and memory are managed in Settings
            - Note: the APK is signed with a CI-generated keystore, so uninstall the previous version before installing this one (app data is stored on-device)
