name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass pocketagent -keypass pocketagent \
            -alias pocket -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Pocket Agent, O=AnishtayiN"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: pocketagent
          KEY_ALIAS: pocket
          KEY_PASSWORD: pocketagent
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "PocketAgent-${{ github.ref_name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-agent-apk
          path: "PocketAgent-*.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "PocketAgent-*.apk"
          body: |
            ## Pocket Agent v8.1 — ایجنت جیبی

            ### تازه‌های نسخه ۸٫۱
            - **مقاوم‌سازی کامل کلاینت هوش مصنوعی طبق مشخصات سرویس**:
              - تا ۳ تلاش مجدد با backoff نمایی (۲ تا ۵ ثانیه) و احترام به Retry-After
              - تشخیص اتمام سهمیه روزانه (429) و پیام شفاف با زمان ریست (۰۰:۰۰ UTC) به‌جای تلاش بی‌فایده
              - مدیریت پنجره ۳۲ هزار توکنی: گفتگوهای طولانی به‌صورت هوشمند کوتاه می‌شوند تا خطا ندهند
            - **جستجوی وب دولایه**: Keenable + پشتیبان خودکار FreeSerp (بدون کلید) — جستجو دیگر با قطعی یک سرویس نمی‌میرد
            - **ابزار جدید اعتبار شرکت‌ها**: امتیاز، تعداد نظرات و لینک پروفایل هر شرکت/دامنه (Trustburn)

            ### قابلیت‌های اصلی
            - حالت فکر عمیق/پاسخ سریع، حلقه ایجنت ۱۶ مرحله‌ای، پلن زنده، صدای دوطرفه
            - تحقیق وب با بازبینی و منابع، پایتون روی گوشی، QR، نرخ ارز، ویکی‌پدیا، آب‌وهوا
            - کنترل گوشی: آلارم/تایمر، تقویم، چراغ‌قوه، پیامک/ایمیل/تماس، نقشه
            - تم تاریک کهکشانی + روشن، حافظه بلندمدت، خروجی گفتگو

            نکته: APK با keystore موقت CI امضا می‌شود؛ قبل از نصب نسخه جدید، نسخه قبلی را حذف کنید.
