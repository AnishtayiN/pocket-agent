name: Release APK + Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass pocketagent -keypass pocketagent \
            -alias pocket -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Pocket Agent, O=AnishtayiN"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: pocketagent
          KEY_ALIAS: pocket
          KEY_PASSWORD: pocketagent
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "PocketAgent-${{ github.ref_name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-agent-apk
          path: "PocketAgent-*.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "PocketAgent-*.apk"
          body: |
            ## Pocket Agent — ایجنت جیبی

            An AI agent with a name, a long-term memory and real tools:
            live web search & page fetch, image generation, on-device Python
            (write → run → debug → deliver files), a private file workspace —
            and it remembers you between conversations.

            **Android:** `PocketAgent-${{ github.ref_name }}.apk` — installs on
            Android 7.0 and newer (API 24+). Signed with a CI-generated
            keystore, so uninstall the previous version before installing
            this one (app data is stored on-device).

            **Windows:** `PocketAgent-Setup-${{ github.ref_name }}.exe` is the
            installer for Windows 7 through 11 (per-user, no admin needed);
            `PocketAgent-Portable-${{ github.ref_name }}.exe` is the same app
            as a single portable file. The Windows edition has the same brain
            and tools (web search, image generation, local Python, memory)
            in a desktop window.

  windows:
    name: Windows EXE
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.8 (last series that runs on Windows 7)
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install PyInstaller
        run: pip install "pyinstaller==5.13.2"

      - name: Build portable EXE
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --name PocketAgent windows/pocket_agent.py
          Copy-Item dist/PocketAgent.exe "PocketAgent-Portable-${{ github.ref_name }}.exe"

      - name: Build installer EXE (NSIS)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Copy-Item dist/PocketAgent.exe windows/PocketAgent.exe
          $fv = "${{ github.ref_name }}".TrimStart("v") + ".0"
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DVERSION=${{ github.ref_name }}" "/DFULLVERSION=$fv" windows/installer.nsi
          Move-Item "windows/PocketAgent-Setup-${{ github.ref_name }}.exe" .

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-agent-windows
          path: |
            PocketAgent-Portable-*.exe
            PocketAgent-Setup-*.exe

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PocketAgent-Portable-*.exe
            PocketAgent-Setup-*.exe
