name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass pocketagent -keypass pocketagent \
            -alias pocket -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Pocket Agent, O=AnishtayiN"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: pocketagent
          KEY_ALIAS: pocket
          KEY_PASSWORD: pocketagent
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "PocketAgent-${{ github.ref_name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-agent-apk
          path: "PocketAgent-*.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "PocketAgent-*.apk"
          body: |
            ## Pocket Agent v7 — ایجنت جیبی

            یک ایجنت کامل روی گوشی: فکر می‌کند، تحقیق می‌کند، کار را انجام می‌دهد و کامل تحویل می‌دهد.

            ### تازه‌های نسخه ۷
            - **صدای دوطرفه**: دیکته پیام با میکروفون (فارسی) + خواندن پاسخ‌ها با صدا (دکمه بلندگو، خواندن خودکار، ابزار speak)
            - **تم تاریک کهکشانی + تم روشن**: انتخاب روشن/تاریک/سیستم، سوییچ سریع در هدر، پس‌زمینه aurora متحرک
            - **پلن زنده کار**: چک‌لیست مراحل که ایجنت حین کار تیک می‌زند
            - **کنترل واقعی گوشی**: آلارم و تایمر، رویداد تقویم، چراغ‌قوه، لرزش، کلیپ‌بورد، وضعیت شبکه، باز کردن لینک و اشتراک‌گذاری
            - **آب‌وهوای زنده** برای هر شهر بدون کلید API
            - حلقه ایجنت تا ۱۶ مرحله + بازبینی پاسخ‌های اطلاعاتی

            ### قابلیت‌های اصلی
            - تحقیق عمیق وب با منابع واقعی، اجرای پایتون روی گوشی و دیباگ خودکار، ساخت عکس
            - پردازش عکس و فایل روی گوشی (OCR، PDF، کد)، حافظه بلندمدت، استریم زنده پاسخ و فکر
            - رابط فارسی راست‌به‌چپ با مارک‌داون کامل و بلوک کد

            نکته: APK با keystore موقت CI امضا می‌شود؛ قبل از نصب نسخه جدید، نسخه قبلی را حذف کنید.
