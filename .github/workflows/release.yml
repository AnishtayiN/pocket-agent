name: Release APK + Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass pocketagent -keypass pocketagent \
            -alias pocket -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Pocket Agent, O=AnishtayiN"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: pocketagent
          KEY_ALIAS: pocket
          KEY_PASSWORD: pocketagent
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "Aura-${{ github.ref_name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-agent-apk
          path: "Aura-*.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "Aura-*.apk"
          body: |
            ## Aura v9 — آورا

            برنامه اسم و هویت تازه گرفت: **آورا (Aura)** — دستیار هوشمند شخصی تو.

            ### تازه‌های نسخه ۹
            - **اسم جدید: آورا** — کوتاه، خوش‌آهنگ و هم‌خوان با تم aurora برنامه (اسم ایجنت مثل قبل در تنظیمات قابل تغییر است)
            - **آیکون کاملاً جدید**: جرقه گرادیانی فیروزه‌ای→بنفش با حلقه مدار روی پس‌زمینه کهکشانی + پشتیبانی آیکون تم‌شونده اندروید ۱۳+
            - **UI خفن‌تر**:
              - خط نور aurora متحرک زیر هدر هنگام کار ایجنت
              - حباب پیام‌های کاربر با گرادیان
              - سه نقطه ضربان‌دار هنگام فکر کردن
              - نوار پیشرفت گرادیانی انیمیشنی روی کارت پلن
              - حاشیه گرادیانی کادر پیام (هنگام تایپ/کار می‌درخشد) و کارت‌های قابلیت
              - نام گرادیانی در هدر و placeholder شخصی‌سازی‌شده

            ### قابلیت‌های اصلی (از نسخه‌های قبل)
            - حالت فکر عمیق/پاسخ سریع، حلقه ایجنت ۱۶ مرحله‌ای با بازبینی، پلن زنده، صدای دوطرفه
            - تحقیق وب دولایه با منابع، پایتون روی گوشی، QR، نرخ ارز، ویکی‌پدیا، آب‌وهوا، اعتبار شرکت‌ها
            - کنترل گوشی: آلارم/تایمر، تقویم، چراغ‌قوه، پیامک/ایمیل/تماس، نقشه
            - تم تاریک کهکشانی + روشن، حافظه بلندمدت، خروجی گفتگو

            نکته: APK با keystore موقت CI امضا می‌شود؛ قبل از نصب نسخه جدید، نسخه قبلی را حذف کنید.

            ### تازه‌های نسخه ۹٫۱
            - **نسخه ویندوز (۷ تا ۱۱)**: فایل `Aura-Setup` نصاب ویندوز و `Aura-Portable` نسخه پرتابل تک‌فایل — همان آورا روی دسکتاپ، با همان ابزارها (جستجوی وب، ساخت تصویر، اجرای پایتون، حافظه)
            - **پشتیبانی از اندروید ۷ به بالا** (قبلاً اندروید ۸ به بالا بود)

  windows:
    name: Windows EXE
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.8 (last series that runs on Windows 7)
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install PyInstaller
        run: pip install "pyinstaller==5.13.2"

      - name: Build portable EXE
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --name Aura windows/pocket_agent.py
          Copy-Item dist/Aura.exe "Aura-Portable-${{ github.ref_name }}.exe"

      - name: Build installer EXE (NSIS)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Copy-Item dist/Aura.exe windows/Aura.exe
          $fv = "${{ github.ref_name }}".TrimStart("v") + ".0"
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DVERSION=${{ github.ref_name }}" "/DFULLVERSION=$fv" windows/installer.nsi
          Move-Item "windows/Aura-Setup-${{ github.ref_name }}.exe" .

      - uses: actions/upload-artifact@v4
        with:
          name: aura-windows
          path: |
            Aura-Portable-*.exe
            Aura-Setup-*.exe

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Aura-Portable-*.exe
            Aura-Setup-*.exe
