name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass pocketagent -keypass pocketagent \
            -alias pocket -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Pocket Agent, O=AnishtayiN"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: pocketagent
          KEY_ALIAS: pocket
          KEY_PASSWORD: pocketagent
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "PocketAgent-${{ github.ref_name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-agent-apk
          path: "PocketAgent-*.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "PocketAgent-*.apk"
          body: |
            ## Pocket Agent v8 — ایجنت جیبی

            ### تازه‌های نسخه ۸
            - **انتخاب حالت فکر**: چیپ «فکر عمیق / پاسخ سریع» بالای کادر پیام + سوییچ در تنظیمات
              - فکر عمیق: فکر کردن زنده، تحقیق وب و بازبینی پاسخ
              - پاسخ سریع: جواب مستقیم API بدون مرحله اضافه
            - **ابزارهای جدید**: ساخت QR کد، نرخ زنده ارز و تبدیل مبلغ، خلاصه ویکی‌پدیا (فارسی/انگلیسی)، شماره‌گیر، پیش‌نویس پیامک و ایمیل، نقشه و مسیریابی
            - **خروجی گرفتن از گفتگو** به‌صورت فایل متنی از تنظیمات

            ### قابلیت‌های اصلی
            - حلقه ایجنت تا ۱۶ مرحله، پلن زنده کار، صدای دوطرفه (میکروفون + خواندن با صدا)
            - تحقیق عمیق وب با منابع، پایتون روی گوشی با دیباگ خودکار، ساخت عکس، آب‌وهوا
            - کنترل گوشی: آلارم/تایمر، تقویم، چراغ‌قوه، لرزش، کلیپ‌بورد
            - تم تاریک کهکشانی + روشن با پس‌زمینه aurora متحرک، حافظه بلندمدت، پردازش عکس و فایل روی گوشی

            نکته: APK با keystore موقت CI امضا می‌شود؛ قبل از نصب نسخه جدید، نسخه قبلی را حذف کنید.
